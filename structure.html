<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهيكل التنظيمي | هيئة قضايا الدولة</title>

    <!-- Meta -->
    <meta name="description" content="الهيكل التنظيمي لهيئة قضايا الدولة">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: { 800: '#075985', 900: '#0c4a6e' },
                        gold: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Tree CSS Logic */
        .tree {
            display: flex;
            justify-content: center;
            direction: ltr;
            /* Force LTR for correct tree rendering, content will be RTL */
        }

        .tree ul {
            padding-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            transition: all 0.5s;
        }

        .tree li {
            float: left;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        /* Connectors */
        .tree li::before,
        .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid #94a3b8;
            /* slate-400 */
            width: 50%;
            height: 20px;
        }

        .tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid #94a3b8;
        }

        /* Remove connectors from only child */
        .tree li:only-child::after,
        .tree li:only-child::before {
            display: none;
        }

        .tree li:only-child {
            padding-top: 0;
        }

        /* Remove left connector from first child and right connector from last child */
        .tree li:first-child::before,
        .tree li:last-child::after {
            border: 0 none;
        }

        /* Adding back the vertical connector to the last nodes */
        .tree li:last-child::before {
            border-right: 2px solid #94a3b8;
            border-radius: 0 5px 0 0;
        }

        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        /* Vertical Time Line down from parent */
        .tree ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid #94a3b8;
            width: 0;
            height: 20px;
            transform: translateX(-50%);
        }

        /* Dark Mode Adjustments */
        :is(.dark) .tree li::before,
        :is(.dark) .tree li::after,
        :is(.dark) .tree ul::before,
        :is(.dark) .tree li:last-child::before,
        :is(.dark) .tree li:first-child::after {
            border-color: #475569;
            /* slate-600 */
        }

        /* Card Styles */
        .node-card {
            display: inline-block;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            background-color: white;
            color: #1e293b;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            position: relative;
            z-index: 10;
            min-width: 180px;
            max-width: 250px;
            direction: rtl;
            /* Restore RTL for content */
        }

        :is(.dark) .node-card {
            background-color: #1e293b;
            border-color: #334155;
            color: white;
        }

        .node-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #f59e0b;
        }

        /* Connector Hover Effect */
        .tree li a:hover+ul li::after,
        .tree li a:hover+ul li::before,
        .tree li a:hover+ul::before,
        .tree li a:hover+ul ul::before {
            border-color: #f59e0b;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-slate-950 text-slate-800 dark:text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav
        class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html"
                    class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-house text-slate-600 dark:text-gold-400 text-lg"></i>
                </a>
                <h1 class="text-xl font-bold text-primary-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-gold-500"></i> الهيكل التنظيمي
                </h1>
            </div>
            <button id="themeToggle"
                class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-gold-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-10 overflow-x-auto">

        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-primary-900 dark:text-white mb-2">هيكل هيئة قضايا الدولة</h2>
            <p class="text-slate-500 dark:text-slate-400">نظرة شاملة على التقسيم الإداري للهيئة</p>
        </div>

        <div class="tree" id="treeContainer">
            <!-- Tree injected here -->
            <div class="flex justify-center items-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gold-500"></div>
            </div>
        </div>

    </main>

    <!-- Script -->
    <script src="js/structure.js"></script>
    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>

</html>
