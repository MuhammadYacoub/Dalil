<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل قضايا الدولة | Premium Directory</title>

    <!-- Meta Tags -->
    <meta name="description" content="دليل مستشاري قضايا الدولة - تصميم رسمي">
    <meta name="theme-color" content="#0f172a">

    <!-- Fonts: Cairo & Alexandria -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49', // Deep Navy
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706', // Dignified Gold
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CustomScrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        /* Hide scrollbar for horizontal scrolling if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header
        class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">

            <!-- Logo area -->
            <div class="flex items-center gap-3">
                <a href="index.html"
                    class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                    title="الرئيسية">
                    <i class="fa-solid fa-house text-slate-600 dark:text-gold-400 text-lg"></i>
                </a>
                <img src="assets/images/logo.png" alt="Logo" class="w-10 h-10 object-contain drop-shadow-sm">
                <div>
                    <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">هيئة قضايا الدولة</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">دليل المستشارين</p>
                </div>
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggle"
                class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-gold-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all focus:outline-none focus:ring-2 focus:ring-gold-500">
                <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
            </button>
        </div>

        <!-- Search Bar (Part of Header on Mobile) -->
        <div class="container mx-auto px-4 pb-3">
            <div class="relative">
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-slate-400"></i>
                </div>
                <input type="text" id="searchInput"
                    class="block w-full p-3 pr-10 text-sm md:text-base text-slate-900 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-gold-500 focus:border-gold-500 dark:bg-slate-900 dark:border-slate-700 dark:placeholder-slate-400 dark:text-white transition-all shadow-sm"
                    placeholder="بحث بالاسم، الرقم، أو الصفة...">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6">

        <!-- Filters (Collapsible on Mobile?) -->
        <div class="mb-6 flex flex-wrap gap-3" id="filtersContainer">
            <select id="rankFilter"
                class="flex-1 min-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm rounded-lg focus:ring-gold-500 focus:border-gold-500 p-2.5 shadow-sm">
                <option value="">كل الدرجات</option>
            </select>

            <select id="sectorFilter"
                class="flex-1 min-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm rounded-lg focus:ring-gold-500 focus:border-gold-500 p-2.5 shadow-sm">
                <option value="">كل القطاعات</option>
            </select>

            <select id="branchFilter"
                class="flex-1 min-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm rounded-lg focus:ring-gold-500 focus:border-gold-500 p-2.5 shadow-sm">
                <option value="">كل الفروع</option>
            </select>
        </div>

        <!-- Results Info -->
        <div class="flex justify-between items-center mb-4">
            <p class="text-sm text-slate-500 dark:text-slate-400">عدد النتائج: <span id="countValue"
                    class="font-bold text-slate-900 dark:text-white">0</span></p>
        </div>

        <!-- Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Cards injected here -->
        </div>

        <!-- Loading / No Results -->
        <div id="statusMessage" class="hidden text-center py-10">
            <p class="text-slate-500 dark:text-slate-400 text-lg">لا توجد نتائج مطابقة</p>
        </div>

        <!-- Load More Button -->
        <div class="text-center mt-8 pb-8">
            <button id="loadMoreBtn"
                class="hidden px-6 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-full hover:bg-gold-500 hover:text-white dark:hover:bg-gold-600 transition-colors font-medium text-sm shadow-sm">
                عرض المزيد
            </button>
        </div>

    </main>

    <!-- Modal -->
    <div id="detailsModal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm transition-opacity opacity-0" id="modalBackdrop">
        </div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                <!-- Modal Panel -->
                <div class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-900 text-right shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg scale-95 opacity-0"
                    id="modalPanel">

                    <!-- Close Button -->
                    <button
                        class="close-modal absolute top-3 left-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none bg-slate-100 dark:bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center">
                        <i class="fa-solid fa-times"></i>
                    </button>

                    <div class="px-4 pb-4 pt-5 sm:p-6 sm:pb-4" id="modalContent">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal (Blocking) -->
    <div id="loginModal"
        class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/95 backdrop-blur-md transition-opacity duration-500">
        <div
            class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-200 dark:border-slate-700 mx-4 relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary-800/10 rounded-full blur-2xl"></div>

            <div class="text-center mb-8 relative z-10">
                <img src="assets/images/logo.png" alt="Logo"
                    class="w-20 h-20 mx-auto mb-4 object-contain drop-shadow-md">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">تسجيل الدخول</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm">أدخل بياناتك للوصول إلى الدليل</p>
            </div>

            <form id="loginForm" class="space-y-4 relative z-10">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">اسم
                        المستخدم / الرقم القومي </label>
                    <input type="text" id="username"
                        class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition-all text-left dir-ltr placeholder:text-right placeholder:dir-rtl"
                        placeholder="2xxxxxxxxxxxxx" required>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">كلمة
                        المرور</label>
                    <input type="password" id="password"
                        class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition-all text-left dir-ltr placeholder:text-right placeholder:dir-rtl"
                        placeholder="••••••••" required>
                </div>

                <div class="flex items-center justify-between mt-1 px-1">
                    <button type="button" id="forgotPasswordBtn"
                        class="text-xs text-primary-800 dark:text-gold-500 hover:underline transition-all">
                        نسيت كلمة المرور؟
                    </button>
                </div>

                <div id="loginError"
                    class="hidden text-red-500 text-sm text-center bg-red-50 dark:bg-red-900/20 p-2 rounded-lg border border-red-100 dark:border-red-900/50">
                    بيانات الدخول غير صحيحة
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-primary-900 hover:bg-primary-800 text-white font-bold rounded-xl shadow-lg shadow-primary-900/20 transition-all transform hover:-translate-y-0.5 mt-2">
                    دخول
                </button>
            </form>

            <p class="text-xs text-center text-slate-400 mt-6">
                هيئة قضايا الدولة © 2026
            </p>
        </div>
    </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Main JS -->
    <script type="module" src="js/main.js?v=4"></script>
</body>

</html>
