<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الموحدة | هيئة قضايا الدولة</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: { 800: '#075985', 900: '#0c4a6e' },
                        gold: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full">
        <!-- Header -->
        <div class="text-center mb-10">
            <img src="assets/images/logo.png" alt="Logo" class="w-20 h-20 mx-auto mb-4 object-contain drop-shadow-sm">
            <h1 class="text-3xl font-bold text-primary-900 mb-2">لوحة التحكم الموحدة</h1>
            <p class="text-slate-500">مرحبا بك في نظام إدارة المحتوى</p>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Consultants Card -->
            <a href="consultants-admin.html"
                class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all border border-slate-200">
                <div
                    class="w-14 h-14 rounded-xl bg-primary-50 text-primary-800 flex items-center justify-center text-2xl mb-4 group-hover:bg-primary-800 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-gavel"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 mb-2">إدارة المستشارين</h2>
                <p class="text-sm text-slate-500 mb-4">إضافة، تعديل، وحذف بيانات السادة المستشارين.</p>
                <span
                    class="text-primary-800 font-medium text-sm flex items-center gap-2 group-hover:gap-3 transition-all">
                    الدخول <i class="fa-solid fa-arrow-left"></i>
                </span>
            </a>

            <!-- Healthcare Card -->
            <a href="admin-healthcare.html"
                class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all border border-slate-200">
                <div
                    class="w-14 h-14 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mb-4 group-hover:bg-rose-600 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 mb-2">إدارة الرعاية الصحية</h2>
                <p class="text-sm text-slate-500 mb-4">تحديث بيانات الأطباء، المستشفيات، والمعامل.</p>
                <span
                    class="text-rose-600 font-medium text-sm flex items-center gap-2 group-hover:gap-3 transition-all">
                    الدخول <i class="fa-solid fa-arrow-left"></i>
                </span>
            </a>

            <!-- Offices Card -->
            <a href="admin-offices.html"
                class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all border border-slate-200">
                <div
                    class="w-14 h-14 rounded-xl bg-gold-50 text-gold-600 flex items-center justify-center text-2xl mb-4 group-hover:bg-gold-500 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 mb-2">إدارة المقرات</h2>
                <p class="text-sm text-slate-500 mb-4">إدارة عناوين وأرقام الفروع والمقرات.</p>
                <span
                    class="text-gold-600 font-medium text-sm flex items-center gap-2 group-hover:gap-3 transition-all">
                    الدخول <i class="fa-solid fa-arrow-left"></i>
                </span>
            </a>

        </div>

        <!-- Back to Site -->
        <div class="text-center mt-12">
            <a href="index.html" class="text-slate-500 hover:text-slate-800 transition-colors text-sm font-medium">
                <i class="fa-solid fa-home ml-1"></i> العودة للموقع الرئيسي
            </a>
        </div>
    </div>

</body>

</html>
